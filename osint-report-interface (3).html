    <script>
        // Script para manejar la funcionalidad de la interfaz
        document.addEventListener('DOMContentLoaded', function() {
            // Establecer la fecha actual en los campos de fecha
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date').value = today;
            
            // Expandir primera sección por defecto
            document.getElementById('section1').classList.add('active');
            
            // Verificar si hay datos guardados
            checkSavedData();
        });

        // Función para alternar secciones
        function toggleSection(sectionId) {
            const section = document.getElementById(sectionId);
            const isActive = section.classList.contains('active');
            
            if (isActive) {
                section.classList.remove('active');
                section.querySelector('.toggle-icon').textContent = '▲';
            } else {
                section.classList.add('active');
                section.querySelector('.toggle-icon').textContent = '▼';
            }
        }

        // Función para buscar en la web
        function searchWeb(fieldId) {
            const fieldValue = document.getElementById(fieldId).value;
            if (fieldValue) {
                const searchQuery = encodeURIComponent(fieldValue);
                window.open(`https://www.google.com/search?q=${searchQuery}`, '_blank');
            }
        }

        // Función para guardar datos
        function saveData() {
            const formData = {};
            
            // Recolectar todos los valores de input, textarea y select
            document.querySelectorAll('input, textarea, select').forEach(element => {
                if (element.id && element.type !== 'file') {
                    formData[element.id] = element.value;
                }
            });
            
            // Recolectar checkboxes
            document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                formData[checkbox.id] = checkbox.checked;
            });
            
            // Guardar en localStorage
            localStorage.setItem('osintReportData', JSON.stringify(formData));
            
            // Mostrar notificación
            showNotification('Datos guardados correctamente.');
        }

        // Función para exportar datos
        function exportData() {
            const formData = {};
            
            // Recolectar todos los valores
            document.querySelectorAll('input, textarea, select').forEach(element => {
                if (element.id && element.type !== 'file') {
                    formData[element.id] = element.value;
                }
            });
            
            // Recolectar checkboxes
            document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                formData[checkbox.id] = checkbox.checked;
            });
            
            // Crear y descargar archivo JSON
            const dataStr = JSON.stringify(formData, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `reporte_osint_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showNotification('Datos exportados correctamente.');
        }

        // Verificar si hay datos guardados
        function checkSavedData() {
            const savedData = localStorage.getItem('osintReportData');
            if (savedData) {
                document.getElementById('notification').style.display = 'block';
            }
        }

        // Cargar datos guardados
        function loadSavedData() {
            const savedData = localStorage.getItem('osintReportData');
            if (savedData) {
                const formData = JSON.parse(savedData);
                
                // Aplicar valores a los campos
                Object.keys(formData).forEach(key => {
                    const element = document.getElementById(key);
                    if (element) {
                        if (element.type === 'checkbox') {
                            element.checked = formData[key];
                        } else {
                            element.value = formData[key];
                        }
                    }
                });
                
                document.getElementById('notification').style.display = 'none';
                showNotification('Datos cargados correctamente.');
            }
        }

        // Mostrar notificación temporal
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.style.display = 'block';
            notification.textContent = message;
            
            document.querySelector('.container').insertBefore(notification, document.querySelector('.section'));
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    </script>
